# ProCosmetics — config.yml (Configuração para Lobby Rankup)

multi_world:
  blacklisted_worlds: true
  worlds:
  - world_nether
  - world_the_end

# Integração nativa com o WorldGuard para restaurar efeitos ao sair de zonas bloqueadas
world_guard:
  enabled: true
  restore_cosmetics: true

storage:
  type: SQLITE
  
  sqlite:
    database: procosmetics
    table_prefix: procosmetics

redis:
  enable: false

economy:
  # Alterado para VAULT para usar a mesma economia gerida pelo EssentialsC
  type: VAULT

settings:
  check_updates: true
  enable_metrics: false
  default_language: en_US
  restore_cosmetics: true
  # Comando que desbloqueia o cosmético no LuckPerms permanentemente após compra
  permission_add_command: lp user <player_uuid> permission set <cosmetic_permission> true
  entity_tracking_range: 32.0

# Desativado na hotbar para não encher o inventário do jogador (o acesso faz-se pelo NPC ou /menu)
cosmetic_item:
  item: minecraft:chest
  count: 1
  slot: 4
  give_on:
    join: false
    world_change: false
    death: false

menu:
  main:
    rows: 5
    items:
      fill_empty_slots:
        enabled: true
        item: minecraft:gray_stained_glass_pane[tooltip_display={hide_tooltip:true}]
        count: 1
      
      arrow_effects:
        enabled: false
        item: minecraft:tipped_arrow[!minecraft:potion_contents]
        count: 1
        slot: 11
        
      balloons:
        enabled: true
        item: minecraft:lead
        count: 1
        slot: 12
        
      banners:
        enabled: true
        item: minecraft:light_blue_banner
        count: 1
        slot: 13
        
      death_effects:
        enabled: false
        item: minecraft:skeleton_skull[!minecraft:rarity]
        count: 1
        slot: 14
        
      emotes:
        enabled: true
        item: minecraft:player_head[profile={properties:[{name:'textures',value:'e3RleHR1cmVzOntTS0lOOnt1cmw6Imh0dHBzOi8vdGV4dHVyZXMubWluZWNyYWZ0Lm5ldC90ZXh0dXJlLzQ3M2U3MmNjMzcxZGUyNWYzMzA1NjY1NzY5ZGQ3ZTlmZjExNjE2OTUyNTJlNzk5NjEyNTgwZGVlZWRkMyJ9fX0='}]},!minecraft:rarity]
        count: 1
        slot: 15
        
      # Desativado: Gadgets disparam itens/projéteis que podem atrapalhar o lobby
      gadgets:
        enabled: false
        item: minecraft:piston
        count: 1
        slot: 20
        
      miniatures:
        enabled: true
        item: minecraft:zombie_head[!minecraft:rarity]
        count: 1
        slot: 21
        
      # Desativado: Evita problemas de colisão ao transformar jogadores em entidades
      morphs:
        enabled: false
        item: minecraft:carved_pumpkin
        count: 1
        slot: 22
        
      # Desativado: Cavalos e outras montadas geram bugs em proteções do WorldGuard
      mounts:
        enabled: false
        item: minecraft:saddle
        count: 1
        slot: 23
        
      music:
        enabled: true
        item: minecraft:music_disc_mall[!minecraft:jukebox_playable, !minecraft:rarity]
        count: 1
        slot: 24
        
      # Partículas essenciais para Lobby
      particle_effects:
        enabled: true
        item: minecraft:nether_star[!minecraft:rarity]
        count: 1
        slot: 30
        
      pets:
        enabled: true
        item: minecraft:bone
        count: 1
        slot: 31
        
      statuses:
        enabled: true
        item: minecraft:name_tag
        count: 1
        slot: 32
        
      unequip_all:
        enabled: true
        item: minecraft:barrier
        count: 1
        slot: -1
        
      coins:
        enabled: true
        item: minecraft:sunflower
        count: 1
        slot: -5

  purchase:
    cosmetic:
      rows: 3
      items:
        fill_empty_slots:
          enabled: true
          item: minecraft:gray_stained_glass_pane[tooltip_display={hide_tooltip:true}]
          count: 1
        accept:
          item: minecraft:lime_terracotta
          count: 1
          slot: 16
        deny:
          item: minecraft:red_terracotta
          count: 1
          slot: 10
    gadget_ammo:
      rows: 3
      items:
        fill_empty_slots:
          enabled: true
          item: minecraft:gray_stained_glass_pane[tooltip_display={hide_tooltip:true}]
          count: 1
        accept:
          item: minecraft:lime_terracotta
          count: 1
          slot: 16
        deny:
          item: minecraft:red_terracotta
          count: 1
          slot: 10
    treasure_chest:
      rows: 3
      items:
        fill_empty_slots:
          enabled: true
          item: minecraft:gray_stained_glass_pane[tooltip_display={hide_tooltip:true}]
          count: 1
        accept:
          item: minecraft:lime_terracotta
          count: 1
          slot: 16
        deny:
          item: minecraft:red_terracotta
          count: 1
          slot: 10

config_version: 1