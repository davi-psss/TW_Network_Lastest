#
regions:
    __global__:
        members: {}
        flags: {other-explosion: deny, use: allow, invincible: allow, interact: allow,
            pvp: deny, mob-spawning: deny, block-place: deny, fire-spread: deny, item-drop: allow,
            fall-damage: deny, feed-delay: 0, item-pickup: allow, passthrough: deny,
            block-break: deny, tnt: deny}
        owners: {}
        type: global
        priority: 0
