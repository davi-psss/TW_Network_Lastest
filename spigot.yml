# This is the Spigot configuration file for Paper.
# As you can see, there's tons to configure. Some options may impact gameplay, so use
# with caution, and make sure you know what each option does before configuring.
#
# If you need help with the configuration or have any questions related to Paper,
# join us in our Discord or check the docs page.
#
# File Reference: https://docs.papermc.io/paper/reference/spigot-configuration/
# Docs: https://docs.papermc.io/
# Discord: https://discord.gg/papermc
# Website: https://papermc.io/

# Spigot Configuration - TW Network (Rankup)
settings:
  debug: false
  timeout-time: 60
  restart-on-crash: true
  restart-script: ./start.bat
  log-villager-deaths: false
  log-named-deaths: false
  save-user-cache-on-stop-only: true
  moved-too-quickly-multiplier: 10.0
  player-shuffle: 0
  user-cache-size: 1000
  moved-wrongly-threshold: 0.0625
  sample-count: 12
  netty-threads: 4
  attribute:
    maxAbsorption:
      max: 2048.0
    maxHealth:
      max: 1024.0
    movementSpeed:
      max: 1024.0
    attackDamage:
      max: 2048.0
  bungeecord: false

messages:
  whitelist: Nao estas na lista de permissao do servidor!
  unknown-command: Comando desconhecido. Escreve "/ajuda" para ver os comandos.
  server-full: O servidor esta cheio!
  outdated-client: Versao desatualizada! Por favor utiliza a versao {0}
  outdated-server: Servidor desatualizado! Ainda na versao {0}
  restart: O servidor esta a reiniciar...

advancements:
  disable-saving: false
  disabled:
  - minecraft:story/disabled

players:
  disable-saving: false

world-settings:
  default:
    below-zero-generation-in-existing-chunks: true
    view-distance: default
    simulation-distance: default
    wither-spawn-sound-radius: 0
    # Desaparecimento mais rapido de itens largados para evitar lag em minas (2 minutos em vez de 5)
    item-despawn-rate: 2400
    mob-spawn-range: 4
    end-portal-sound-radius: 0
    # Remove a IA de monstros de gaiolas/spawners, poupando CPU drastico em farmas
    nerf-spawner-mobs: true
    arrow-despawn-rate: 300
    trident-despawn-rate: 300
    hanging-tick-frequency: 100
    thunder-chance: 100000
    unload-frozen-chunks: false
    max-tnt-per-tick: 100
    
    # Reducao de alcance de renderizacao de entidades
    entity-tracking-range:
      players: 48
      animals: 32
      monsters: 32
      misc: 24
      display: 64
      other: 32
    
    # Menos calculos para entidades que estao paradas ou distantes
    entity-activation-range:
      animals: 16
      monsters: 24
      raiders: 32
      misc: 8
      water: 8
      villagers: 16
      flying-monsters: 24
      wake-up-inactive:
        animals-max-per-tick: 4
        animals-every: 1200
        animals-for: 100
        monsters-max-per-tick: 8
        monsters-every: 400
        monsters-for: 100
        villagers-max-per-tick: 4
        villagers-every: 600
        villagers-for: 100
        flying-monsters-max-per-tick: 8
        flying-monsters-every: 200
        flying-monsters-for: 100
      villagers-work-immunity-after: 100
      villagers-work-immunity-for: 20
      villagers-active-for-panic: true
      tick-inactive-villagers: false
      ignore-spectators: false
    
    # Sementes do mundo
    seed-village: 10387312
    seed-desert: 14357617
    seed-igloo: 14357618
    seed-jungle: 14357619
    seed-swamp: 14357620
    seed-monument: 10387313
    seed-shipwreck: 165745295
    seed-ocean: 14357621
    seed-outpost: 165745296
    seed-endcity: 10387313
    seed-nether: 30084232
    seed-mansion: 10387319
    seed-fossil: 14357921
    seed-portal: 34222645
    seed-ancientcity: 20083232
    seed-trailruins: 83469867
    seed-trialchambers: 94251327
    seed-abandonedcamp: 91231127
    seed-buriedtreasure: 10387320
    seed-mineshaft: default
    seed-stronghold: default
    seed-slime: 987234911
    
    growth:
      cactus-modifier: 100
      cane-modifier: 100
      melon-modifier: 100
      mushroom-modifier: 100
      pumpkin-modifier: 100
      sapling-modifier: 100
      beetroot-modifier: 100
      carrot-modifier: 100
      potato-modifier: 100
      torchflower-modifier: 100
      wheat-modifier: 100
      netherwart-modifier: 100
      vine-modifier: 100
      cocoa-modifier: 100
      bamboo-modifier: 100
      sweetberry-modifier: 100
      kelp-modifier: 100
      twistingvines-modifier: 100
      weepingvines-modifier: 100
      cavevines-modifier: 100
      glowberry-modifier: 100
      pitcherplant-modifier: 100
    
    dragon-death-sound-radius: 0
    max-tick-time:
      tile: 20
      entity: 20
    enable-zombie-pigmen-portal-spawns: false
    zombie-aggressive-towards-villager: false
    
    # VITAL PARA MINAS RANKUP: Junta blocos e exp no chao em pilhas maiores
    merge-radius:
      item: 4.0
      exp: 4.0
    
    hunger:
      jump-walk-exhaustion: 0.05
      jump-sprint-exhaustion: 0.2
      combat-exhaustion: 0.1
      regen-exhaustion: 6.0
      swim-multiplier: 0.01
      sprint-multiplier: 0.1
      other-multiplier: 0.0
    
    # Otimizacao dos funis/hoppers
    ticks-per:
      hopper-transfer: 8
      hopper-check: 8
    hopper-amount: 1
    hopper-can-load-chunks: false
    verbose: false
  worldeditregentempworld:
    verbose: false

config-version: 13\
commands:
  tab-complete: 0
  send-namespaced: false
  log: true
  silent-commandblock-console: false
  spam-exclusions:
  - /skill
  replace-commands:
  - setblock
  - summon
  - testforblock
  - tellraw
  enable-spam-exclusions: false

stats:
  disable-saving: false
  forced-stats: {}
